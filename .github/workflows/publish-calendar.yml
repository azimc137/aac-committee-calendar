name: Update AAC committee calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'  # Daily at 12:17 UTC (6:17 or 7:17 Central)
  push:
    branches: [main]
    paths:
      - 'build_calendar.py'
      - '.github/workflows/publish-calendar.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert public events to iCalendar
        run: python build_calendar.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
